# Tooling for this repository only. The template's own pyproject.toml is under
# template/, and Copier renders nothing from here.
[project]
name = "copier-python"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pre-commit>=4.6",
  "rumdl>=0.3",
]

[tool.uv]
# Nothing to build or install: the environment only holds the tools.
package = false
