version: 2
updates:
  # Only the root workflows: Dependabot does not read the `.jinja` ones under
  # template/, so those are bumped by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Scopeless Conventional Commits: "build: bump ...". Both labels are in the
    # baseline every repository has.
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "build"
    groups:
      actions:
        patterns:
          - "*"
  # The uv ecosystem updates uv.lock, which pins pre-commit for `just qa` and CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "build"
