name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pre-commit hooks, the same list `just qa` runs. Hooks that fix files fail
  # here when they change something, and the diff shows what they changed.
  qa:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # The render job otherwise computes the same cache key, and whichever
          # loses the race to reserve it logs a warning.
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # Renders every variant and runs the checks each generated project runs.
  render:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Copier reads the template's git history to record `_commit`.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: scripts/test-template.sh

  # The one check a ruleset requires, so adding or renaming a job never needs a
  # ruleset change. Keep every other job in `needs`. It runs whatever the others
  # did, and fails when one failed or was canceled.
  ci-passed:
    name: CI passed
    needs: [qa, render]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail when a job failed or was canceled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
